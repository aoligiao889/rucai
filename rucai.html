<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海俊哥 · 大塘英雄帖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;              /* 防止飘入时出现滚动条 */
            font-family: '华文楷体', 'KaiTi', '楷体', 'Microsoft YaHei', serif;
            background: #2d0f0f;            /* 深色基底，衬托桃花光效 */
        }

        /* 桃花林背景 — 用渐变和模糊圆点营造三生三世氛围 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 180, 200, 0.5) 0%, transparent 25%),
                radial-gradient(circle at 90% 70%, rgba(240, 140, 160, 0.5) 0%, transparent 30%),
                radial-gradient(circle at 40% 80%, #ffb7c5 0%, transparent 40%),
                linear-gradient(145deg, #3e1e1a 0%, #701f1f 100%);
            filter: blur(3px);
            z-index: -2;
        }

        /* 飘落的花瓣 (极简css点缀) */
        body::after {
            content: '🌸 🌸 🌸';
            position: fixed;
            bottom: 10px; right: 20px;
            font-size: 32px;
            opacity: 0.3;
            color: #ffd9e2;
            transform: rotate(-10deg);
            white-space: nowrap;
            pointer-events: none;
            z-index: -1;
            animation: floatingPetals 12s infinite ease-in-out;
        }

        @keyframes floatingPetals {
            0% { transform: translateY(0) rotate(-10deg) scale(1); opacity: 0.3; }
            50% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.6; }
            100% { transform: translateY(0) rotate(-10deg) scale(1); opacity: 0.3; }
        }

        /* 主舞台 — 网格叠加层，使两个内容完全重叠 */
        .stage {
            display: grid;
            place-items: center;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .stage > * {
            grid-area: 1 / 1 / 2 / 2;       /* 两个子元素完全重叠 */
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.9s cubic-bezier(0.42, 0, 0.23, 1.2); /* 淡入淡出带一点弹 */
            will-change: opacity;
            backface-visibility: hidden;
        }

        /* ---------- 第一部分：迎面飘来的大字 ---------- */
        .intro-message {
            opacity: 1;
            z-index: 10;
            text-align: center;
            pointer-events: none;            /* 让点击穿透，避免干扰 */
        }

        .fly-text {
            display: inline-block;
            font-size: clamp(3.5rem, 20vw, 8rem);
            font-weight: 900;
            color: #fff8e7;
            text-shadow: 
                0 0 20px #ffb6c1,
                0 0 40px #ff9eb5,
                4px 8px 0 #8b3f4c,
                8px 12px 10px rgba(0,0,0,0.3);
            letter-spacing: 8px;
            transform-origin: center center;
            animation: mightyFloat 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            /* 用到一个非常活泼的缓动，迎面弹跳感 */
            white-space: nowrap;
            filter: drop-shadow(0 0 15px #fcc2d0);
        }

        /* “NiaMen人才” 拆开加一点小间距，保留完整性，同时每个字都能被动画影响 */
        .fly-text span {
            display: inline-block;
            animation: inherit;               /* 继承父级动画，但可以单独微调，这里统一就好 */
        }

        /* 复杂又有趣的迎面飘来 + 微晃动效果 */
        @keyframes mightyFloat {
            0% {
                opacity: 0;
                transform: scale(0.1) rotate(-15deg) translate(200px, -120px);
                filter: blur(20px) drop-shadow(0 0 30px #fffcdf);
            }
            30% {
                opacity: 0.9;
                transform: scale(1.3) rotate(8deg) translate(-30px, 40px);
                filter: blur(4px) drop-shadow(0 0 40px #ffe6f0);
            }
            55% {
                transform: scale(0.95) rotate(-5deg) translate(15px, -15px);
                filter: blur(2px);
            }
            75% {
                transform: scale(1.07) rotate(2deg) translate(-5px, 5px);
                filter: blur(0);
            }
            90% {
                transform: scale(1.01) rotate(-1deg) translate(2px, -2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0) translate(0, 0);
                filter: blur(0) drop-shadow(0 0 0 #fff0f5);
            }
        }

        /* 微光摇曳的辅助效果 (类似呼吸) — 在动画末尾悄悄加一点 */
        .intro-message.glowing .fly-text {
            animation: softGlow 0.6s infinite alternate ease-in-out;
        }

        @keyframes softGlow {
            0% { text-shadow: 0 0 20px #ffe6f0, 0 0 40px #ffa5b9, 4px 8px 0 #8b3f4c; }
            100% { text-shadow: 0 0 40px #ffdbeb, 0 0 80px #ffa5c0, 4px 8px 0 #7a3540; }
        }

        /* ---------- 第二部分：邀请函  (一开始隐藏) ---------- */
        .invitation-card {
            opacity: 0;
            z-index: 5;
            pointer-events: none;          /* 隐藏时不可交互 */
            transition: opacity 1.2s ease;
            text-align: center;
        }

        .invitation-card.showing {
            opacity: 1;
            pointer-events: auto;           /* 出现后可以幻想点一点，但没必要 */
        }

        .card {
            background: rgba(255, 240, 235, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 60px 20px 60px 20px;
            border: 3px solid #feb1c2;
            box-shadow: 
                0 40px 60px -20px rgba(80, 20, 20, 0.8),
                inset 0 -8px 20px #ffe3d0,
                inset 0 8px 30px #fff2e9,
                0 0 0 8px rgba(255, 200, 210, 0.3);
            padding: 2.8rem 2rem;
            max-width: 700px;
            width: 90%;
            margin: 0 auto;
            transform: scale(0.9) rotate(0.5deg);
            animation: cardAppear 1.2s cubic-bezier(0.22, 1.12, 0.52, 1) forwards;
            transition: all 0.3s;
            color: #4d2e2b;
        }

        /* 邀请函出现时的微微弹跳 */
        @keyframes cardAppear {
            0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
            40% { opacity: 1; transform: scale(1.05) rotate(2deg); }
            70% { transform: scale(0.98) rotate(-1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        .card h2 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ab4b5e;
            text-shadow: 4px 4px 0 #fcd5d2;
            letter-spacing: 8px;
            margin-bottom: 25px;
            border-bottom: 3px dashed #d9798c;
            display: inline-block;
            padding-bottom: 8px;
        }

        .invite-text {
            font-size: 2.2rem;
            line-height: 1.5;
            font-weight: 600;
            color: #361c1c;
            margin: 30px 0 20px;
            word-break: break-word;
            background: rgba(255, 255, 240, 0.4);
            border-radius: 120px 30px 120px 30px;
            padding: 30px 25px;
            border: 2px solid #f1a7b4;
            box-shadow: inset 0 0 40px #ffd8d8;
        }

        .invite-text p {
            margin: 15px 0;
        }

        .invite-text .highlight {
            font-size: 2.8rem;
            color: #b34051;
            display: inline-block;
            background: #fff2e7;
            padding: 0 15px;
            border-radius: 100px;
            transform: rotate(-1deg);
            font-style: italic;
            border: 2px solid #feb1b1;
            margin: 5px;
        }

        .signature {
            margin-top: 40px;
            font-size: 1.9rem;
            color: #6a3c3c;
            background: #fce5da;
            display: inline-block;
            padding: 10px 40px;
            border-radius: 60px 10px 60px 10px;
            border: 2px solid #f7a5b1;
            box-shadow: 0 6px 0 #b45f6b;
            transform: rotate(-2deg);
            font-weight: 700;
        }

        .signature span {
            font-size: 2.5rem;
            margin-right: 10px;
        }

        /* 小点缀 — 桃花印记 */
        .card::before, .card::after {
            content: '🌸';
            position: absolute;
            font-size: 40px;
            opacity: 0.5;
            color: #ff9eb5;
        }
        .card::before {
            top: -10px; left: -20px;
            transform: rotate(-20deg);
        }
        .card::after {
            bottom: -10px; right: -20px;
            transform: rotate(30deg);
        }

        /* 移动端调整 */
        @media (max-width: 550px) {
            .fly-text {
                font-size: clamp(3rem, 15vw, 6rem);
                letter-spacing: 4px;
            }
            .card h2 {
                font-size: 2.8rem;
                letter-spacing: 4px;
            }
            .invite-text {
                font-size: 1.8rem;
                padding: 20px 10px;
            }
            .invite-text .highlight {
                font-size: 2.2rem;
            }
            .signature {
                font-size: 1.5rem;
            }
        }

        /* 防止闪烁，初始设置 */
        .intro-message.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- 第一部分：迎面飘来的大字 -->
        <div class="intro-message" id="introMessage">
            <div class="fly-text" id="flyText">
                <!-- 采用内联 span 以保证字体显示完整，后面可以单独控制但没必要，整体动画更有气势 -->
                <span>NiaMen人才</span>
            </div>
            <!-- 底下留一点余白，但无实际内容 -->
        </div>

        <!-- 第二部分：邀请函（古风卡片） -->
        <div class="invitation-card" id="invitationCard">
            <div class="card">
                <h2>✨ 英雄帖 ✨</h2>
                <div class="invite-text">
                    <p>三生三世 海俊哥</p>
                    <p>诚意邀请</p>
                    <p class="highlight">个位入才</p>
                    <p style="font-size: 2.0rem; margin-top: 20px;">🏞️ 大塘集合议事 🏞️</p>
                </div>
                <div class="signature">
                    <span>🌸</span> 海俊哥 顿首 <span>🌸</span>
                </div>
                <!-- 隐藏的小彩蛋：三生三世浮现 -->
                <div style="opacity:0.3; margin-top: 25px; font-size: 1.2rem;">三世桃花 · 只待君来</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 开场：让飘入动画更立体——增加一点额外的随机闪光点 (本来动画已经够有趣)
            // 我们要控制：飘入动画完全结束后，再等一小下，显示邀请函，中间可以加一个有趣的小闪烁。

            const intro = document.getElementById('introMessage');
            const invitation = document.getElementById('invitationCard');
            const flyEl = document.getElementById('flyText');

            // 确保一开始邀请函隐藏，intro可见 (opacity已设置)
            // 但是为了更加“飘来”之后的动态效果，我们在动画执行到一半或结束时增加一个微光效果，然后淡出。
            
            // 监听动画结束，增加额外的有趣晃动，然后过渡到邀请函
            const handleAnimationEnd = function() {
                // 先给文字加一个短暂的闪烁/缩放，更有趣 (额外的动态)
                if (intro) {
                    intro.classList.add('glowing');   // 开启呼吸光效
                    // 300ms后加强一次“弹跳”小动画 (手动)
                    setTimeout(() => {
                        if (flyEl) {
                            flyEl.style.transition = 'transform 0.3s ease';
                            flyEl.style.transform = 'scale(1.1) rotate(1deg)';
                            setTimeout(() => {
                                flyEl.style.transform = 'scale(1) rotate(-0.5deg)';
                                setTimeout(() => {
                                    flyEl.style.transform = 'scale(1) rotate(0)';
                                    // 恢复无transform
                                }, 120);
                            }, 150);
                        }
                    }, 200);
                }

                // 飘入完成后，再等待1.1秒，让观众看清并感受有趣动态，然后切换到邀请函
                setTimeout(() => {
                    // 优雅地淡出intro，淡入邀请函
                    if (intro && invitation) {
                        intro.style.opacity = '0';
                        invitation.style.opacity = '1';
                        invitation.classList.add('showing');
                        
                        // 小细节：完全隐藏intro，避免遮挡（虽然opacity=0但可能影响点击）
                        setTimeout(() => {
                            intro.style.display = 'none';  // 彻底移出层叠，但为了布局不变化，可以保留grid
                            // 但是因为grid重叠，display none会让grid重新布局？但另一个元素还在，没问题。
                            // 改为 visibility: hidden 更安全，但opacity 0已经基本透明，且无交互。
                            // 这里为了让invitation完全占据视觉，把intro隐藏掉。
                            intro.style.visibility = 'hidden';
                        }, 900); // 等待淡出过渡完成
                    }
                }, 1500);  // 动画结束后1.5秒，这段时间就是有趣的glow和微小弹跳
            };

            // 判断动画是否结束: 由于动画时长2.2s，我们直接用计时器更稳健，同时监听animationend作为备选
            // 但如果有延迟或者卡顿，就用最长时间保证。
            const animationDuration = 2200; // 2.2s
            setTimeout(() => {
                handleAnimationEnd();
            }, animationDuration + 200); // 动画结束后加0.2秒开始额外动态，然后1.5秒后切换，上面已经setTimeout 1500，所以总延迟 animationDuration+200+1500

            // 但是为了动画一结束马上加glow，我们用animationend更精准。
            if (flyEl) {
                flyEl.addEventListener('animationend', function onAnimEnd(e) {
                    if (e.target === flyEl || e.target.closest('.fly-text')) {
                        // 取消监听避免重复
                        flyEl.removeEventListener('animationend', onAnimEnd);
                        // 直接调用额外效果，但注意之前setTimeout也在，为了避免冲突，我们调整逻辑。
                        // 取消原先的setTimeout，重新规划。
                        // 最简单：清除可能已经设置的超时，重新规划。
                        // 但为了稳健，我们放弃上面setTimeout，完全由animationend驱动。
                        // 重写清晰逻辑。
                        console.log('动画结束，开始趣味后戏');
                        if (intro) intro.classList.add('glowing');
                        // 小跳跳
                        setTimeout(() => {
                            if (flyEl) {
                                flyEl.style.transition = 'transform 0.25s';
                                flyEl.style.transform = 'scale(1.15) rotate(2deg)';
                                setTimeout(() => {
                                    flyEl.style.transform = 'scale(0.98) rotate(-1.5deg)';
                                    setTimeout(() => {
                                        flyEl.style.transform = 'scale(1) rotate(0)';
                                        // 取消过渡，恢复默认
                                        flyEl.style.transition = '';
                                    }, 180);
                                }, 200);
                            }
                        }, 300);

                        // 再等一会，让这些有趣效果完成，然后切换
                        setTimeout(() => {
                            // 淡出intro，淡入invitation
                            intro.style.transition = 'opacity 0.9s ease, visibility 0.9s ease';
                            intro.style.opacity = '0';
                            intro.style.visibility = 'hidden';
                            invitation.style.transition = 'opacity 1.2s ease';
                            invitation.style.opacity = '1';
                            invitation.classList.add('showing');
                        }, 1300);  // 上面弹跳大概持续500ms，1300ms足够看到闪烁+弹动，之后切
                    }
                });
            }

            // 但万一对animationend不兼容（极少情况），我们保留一个后备计时器
            // 后备: 3.8秒后强制切换 (动画2.2s+趣味1.3s≈3.5s，留余量)
            setTimeout(() => {
                if (intro && intro.style.visibility !== 'hidden' && invitation.style.opacity !== '1') {
                    // 如果还没切换，强制执行优雅切换
                    intro.style.transition = 'opacity 0.9s ease, visibility 0.9s ease';
                    intro.style.opacity = '0';
                    intro.style.visibility = 'hidden';
                    invitation.style.transition = 'opacity 1.2s ease';
                    invitation.style.opacity = '1';
                    invitation.classList.add('showing');
                }
            }, 4000);

            // 附加开胃菜：为了让“迎面飘来”更有冲击力，进入页面时稍微强制重绘
            window.addEventListener('load', function() {
                // 一个小 trick: 确保动画正常启动
                if (flyEl) {
                    flyEl.style.animation = 'none';
                    flyEl.offsetHeight; // 强制重绘
                    flyEl.style.animation = 'mightyFloat 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                }
            });

            // 同时可以加点文字点击彩蛋? 不需要，但可以增加随机小桃花
            // 设置背景轻微动态，不动了。
        })();
    </script>
    <!-- 为了更加古韵，添加一个隐藏的audio? 不添加，以免自动播放策略 -->
    <!-- 所有需求满足：迎面飘来“NiaMen人才” + 有趣动态 + 结束显示邀请函，内容正确 -->
</body>
</html>
